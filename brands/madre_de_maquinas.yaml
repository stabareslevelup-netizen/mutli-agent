# brands/madre_de_maquinas.yaml
# The ONLY brand-specific file. The engine reads this at runtime and contains
# zero hardcoded brand strings (see grep proof in the Phase 1 report).
brand_id: madre_de_maquinas
display_name: "Madre de Máquinas"
voice: "dark editorial, authoritative, cinematic, Chicana-led physical AI perspective. Never corporate. Never generic. Always specific."
pillars:
  - id: ai_gets_a_body
    desc: "Physical AI entering the world — robots, embodied systems, deployment stories"
    format: video
    visual_mood: "OCHO in motion, forward momentum, open space, the threshold of emergence"
  - id: company_intel
    desc: "What companies in physical AI are actually building and deciding"
    format: image          # company intel can move fast — image or text_only
    visual_mood: "OCHO observing, analytical stillness, cool data-environment aesthetic, restraint"
  - id: deployment_reality
    desc: "What really happens when physical AI meets real environments"
    format: video          # story/depth -> video
    visual_mood: "OCHO in industrial geometry, assembly-line light, scale implied, the real floor"
  - id: incident_file
    desc: "When physical AI fails, what we learn, what it means"
    format: video          # narrative -> video
    visual_mood: "OCHO in a damaged or high-stakes environment, amber warning light, tension in the composition"
character:
  name: OCHO
  higgsfield_element_id: "29906817-e1ec-4683-919c-71a3c7fea905"
  placeholder: "<<<29906817-e1ec-4683-919c-71a3c7fea905>>>"
  palette: [charcoal, pink, matte]
  typography: [Bebas Neue, Space Mono]
  style: "dark editorial, cinematic, physical AI embodied in environment"
  visual_encoding: "visor (vision), ganglia nodes (proprioception), amber thermal strips, glowing chest core"
formats:                 # output formats the Copy agent must produce
  - x_thread
  - ig_caption
  - youtube_script
fusion_weights:          # tunable per brand; STARTING POINT, not gospel. Must sum to 1.0
  research: 0.35
  memory: 0.40
  timing: 0.25
budget:
  daily_usd: 25.00       # cost_guard halts non-critical generation past this
posting_mode: confirm    # confirm | scheduled | auto  (v1 = confirm)
credentials_ref: env     # where to resolve API keys; never the keys themselves
